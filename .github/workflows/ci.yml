name: Continuous Integration
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Test
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [lts/*, lts/-1, lts/-2]

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # timeout guard: a hang here means a real teardown/termination bug
        # (see the fsqrt c=0 non-residue hang, fixed in d99c27b) and should
        # fail loudly rather than burn the 6h Actions limit
        run: timeout 12m npm test
