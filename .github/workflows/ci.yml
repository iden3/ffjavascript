name: Continuous Integration
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Test
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [lts/*, lts/-1, lts/-2]

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # vitest's forks pool occasionally loses the fork<->main IPC result
        # message under CPU contention (reproduced locally at ~12% on a
        # 2-CPU cgroup; fork idle with the file assigned, socket queues
        # drained, main waiting forever -- killing the fork unblocks it).
        # Present in vitest 4.1.11 and 5.0.0-rc.2; threads pool is not an
        # option (the web-worker shim mis-detects worker threads). Until
        # fixed upstream, bound each attempt and retry once.
        run: timeout 12m npm test || { echo "::warning::vitest forks-pool IPC hang, retrying once"; timeout 12m npm test; }
