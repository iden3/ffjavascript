on:
  pull_request:
  push:
    branches:
      - "master"

name: Run Tests

jobs:
  test:
    name: run tests
    permissions:
      contents: read
    strategy:
      matrix:
        node: ["24.22", "26.x"]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install npm 12
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Check dependency hardening
        run: npx --no-install harden check --package-manager npm --level moderate

      - name: Install playwright webkit
        run: npx playwright install-deps webkit

      - name: Install browsers
        run: npx playwright install

      - name: Run tests
        run: npm run test

      - name: Check release notes
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          npm exec -- changeset status --since="origin/${BASE_REF}"
